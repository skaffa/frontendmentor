<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<!-- displays site properly based on user's device -->

	<link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

	<title>Frontend Mentor | NFT preview card component</title>

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=swap');

		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			font-family: 'Outfit', sans-serif;
		}

		body {
			background-color: hsl(217, 54%, 11%);
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.card {
			background-color: hsl(216, 50%, 16%);
			box-shadow: 0px 20px 30px rgba(0, 0, 0, 0.2);
			border-radius: 10px;
			padding: 1.25rem;
			width: 300px;
			max-width: 85%;
			display: flex;
			flex-direction: column;
		}

		.main {
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 0.75rem;
		}

		.cover-img-wrapper {
			width: 100%;
			aspect-ratio: 1;
			position: relative;
			cursor: pointer;
		}

		.cover-img-wrapper:hover::after {
			content: '';
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background-color: hsla(178, 100%, 50%, 0.502);
			border-radius: 10px;
			background-image: url('./images/icon-view.svg');
			background-position: center center;
			background-repeat: no-repeat;
		}

		.cover-img {
			width: 100%;
			aspect-ratio: 1;
			border-radius: 10px;
		}

		.name {
			color: hsl(0, 0%, 100%);
			font-size: 1.15rem;
			font-weight: 600;
		}

		.desc {
			color: hsl(215, 51%, 70%);
			font-size: 0.9rem;
		}

		.set {
			display: flex;
			justify-content: space-between;
			
		}

		.set div {
			display: flex;
			align-items: center;
			gap: 0.4rem;
			font-size: 0.9rem;
			color: hsl(215, 51%, 70%);
		}

		.set div:first-child {
			color: hsl(178, 100%, 50%);
			font-weight: 600;
		}

		hr {
			border: none;
			height: 1px;
			background-color: hsl(215, 32%, 27%);
			margin-top: 1.15rem;
			margin-bottom: .85rem;
		}

		.card-footer {
			display: flex;
			align-items: center;
			gap: 0.5rem;
			font-size: 0.9rem;
			color: hsl(215, 51%, 70%);
		}

		.avatar {
			width: 2rem;
			height: 2rem;
			background-color: hsl(0, 0%, 100%);
			border-radius: 100%;
			background-image: url('./images/image-avatar.png');
			background-size: 100%;
			border: solid 1px white;
			background-position: center center;
			background-repeat: no-repeat;
			
		}

		.footer-name {
			font-size: inherit;
			color: hsl(0, 0%, 100%);
		}

		.hover:hover {
			color: hsl(178, 100%, 50%);
			cursor: pointer;
		}
	</style>
</head>

<body>

	<div class="card">
		<div class="main">
			<div class="cover-img-wrapper">
				<img src="./images/image-equilibrium.jpg" alt="Equilibrium" class="cover-img">
			</div>
			<div class="name hover">Equilibrium #3429</div>

			<p class="desc">Our Equilibrium collection promotes balance and calm.</p>

			<div class="set">
				<div class="value"><img src="./images/icon-ethereum.svg	" alt="Ethereum">0.041 ETH</div>
				<div class="time"><img src="./images/icon-clock.svg" alt="Clock">3 days left</div>
			</div>
		</div>
		<hr>
		<div class="card-footer">
			<div class="avatar"></div>
			<div>Creation of <span class="footer-name hover">Jules Wyvern</span></div>
		</div>
	</div>

</body>

</html>
